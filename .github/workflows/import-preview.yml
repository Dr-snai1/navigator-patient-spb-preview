name: Prepare temporary viewing page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-preview.yml'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and retain only built viewing files
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          for root in ('site','docs'):
            p=pathlib.Path(root)
            meta=json.loads((p/'preview-meta.json').read_text())
            proof=json.loads((p/'checkout-proof.json').read_text())
            assert meta['preview'] is True and meta['production'] is False
            assert meta['sourceSha']==proof['requestedSha']
            assert meta['sourceTreeSha']==proof['localTreeSha']
            assert proof['localTreeMatchesRequestedCommit'] is True
            assert (p/'index.html').exists() and (p/'404.html').exists()
          print('Preview ready on existing main/docs Pages path')
          PY
