name: T077 publish exact no-Q701 built preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-preview.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import approved compiled-only payload
        env:
          ZIP_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-17ac-8210-b8c3-fdd47a703dc5/raw?se=2026-10-08T23%3A19%3A09Z&sp=r&sv=2026-02-06&sr=b&scid=99f71cf7-0fc4-5c0d-bb7c-d059b1f8c860&skoid=e32cbaad-a1eb-4299-9f16-1b364ab43781&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-08T04%3A49%3A22Z&ske=2026-10-09T04%3A49%3A22Z&sks=b&skv=2026-02-06&sig=2LalHZYdSELdhW7g8lTMEEUWljLmjqCB5kUt6vkrlmE%3D'
        run: |
          set -euo pipefail
          curl -fL --retry 3 "$ZIP_URL" -o /tmp/preview.zip
          rm -rf site docs
          mkdir -p site
          unzip -q /tmp/preview.zip -d site
          python3 - <<'PY'
          import pathlib,json
          p=pathlib.Path('site')
          files={str(x.relative_to(p)) for x in p.rglob('*') if x.is_file()}
          allowed={'index.html','404.html','preview-meta.json','checkout-proof.json'}
          assert allowed.issubset(files)
          assert all(x in allowed or x.startswith('assets/') for x in files),files
          m=json.loads((p/'preview-meta.json').read_text())
          q=json.loads((p/'checkout-proof.json').read_text())
          sha='7dc1b5e969c477bde774ae4ed16405ab10ad94c0'
          tree='8617e6120eb6659adafcb0501ca3ea7a221b60d7'
          assert m['preview'] is True and m['production'] is False
          assert m['sourceSha']==sha and m['sourceTreeSha']==tree
          assert m['checkpoint']=='baseline-s01-s07-no-q701-2026-10-09'
          assert m['tagObject']=='71b70dc100e4bd5d4f5f3307b3abc4a5b0b46b94'
          assert m['basePath']=='/navigator-patient-spb-preview/'
          for k in ['requestedSha','githubResolvedCommitSha','localHeadSha']: assert q[k]==sha
          for k in ['requestedTreeSha','localTreeSha']: assert q[k]==tree
          assert q['localTreeMatchesRequestedCommit'] is True
          assert '/navigator-patient-spb-preview/assets/' in (p/'index.html').read_text()
          print('T077 verified compiled-only payload',sha,tree)
          PY
          cp -a site docs
      - name: Commit approved preview payload
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site docs
          git diff --cached --quiet && exit 0
          git commit -m "Publish S07 no-Q701 QA-approved checkpoint 7dc1b5e"
          git push
