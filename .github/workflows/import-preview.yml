name: Prepare temporary viewing page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-preview.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary preview repo
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages folder
        run: |
          set -euo pipefail
          rm -rf docs
          cp -R site docs
          test -f docs/index.html
          test -f docs/404.html
          test -d docs/assets
          python - <<'PY'
          import json, pathlib
          expected="721d173e6a5d052dd9c8193e96e1517612e322b5"
          expected_tree="cf2298c9a80de1b87c2469acdf5b4c26f08f1633"
          meta=json.loads(pathlib.Path("docs/preview-meta.json").read_text())
          proof=json.loads(pathlib.Path("docs/checkout-proof.json").read_text())
          assert meta["preview"] is True
          assert meta["production"] is False
          assert meta["sourceSha"] == expected
          assert meta["sourceTreeSha"] == expected_tree
          assert proof["requestedSha"] == expected
          assert proof["githubResolvedCommitSha"] == expected
          assert proof["requestedTreeSha"] == expected_tree
          assert proof["localHeadSha"] == expected
          assert proof["localTreeSha"] == expected_tree
          assert proof["localTreeMatchesRequestedCommit"] is True
          print("Exact E01 viewing page verified:", expected, expected_tree)
          PY

      - name: Save viewing-page files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet && exit 0
          git commit -m "Prepare E01 citywide viewing page"
          git push
