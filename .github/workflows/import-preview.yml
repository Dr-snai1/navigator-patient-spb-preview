name: Prepare temporary viewing page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-preview.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout temporary preview repo
        uses: actions/checkout@v4

      - name: Prepare GitHub Pages folder
        run: |
          rm -rf docs
          cp -R site docs
          test -f docs/index.html
          test -f docs/404.html
          python - <<'PY'
          import json, pathlib
          expected="42697cd273adf617ba17f1562dd68574ef314c1c"
          meta=json.loads(pathlib.Path("docs/preview-meta.json").read_text())
          proof=json.loads(pathlib.Path("docs/checkout-proof.json").read_text())
          assert meta["sourceSha"] == expected
          assert proof["requestedSha"] == expected
          assert proof["githubResolvedCommitSha"] == expected
          assert proof["localTreeMatchesRequestedCommit"] is True
          print("Exact preview verified:", expected)
          PY

      - name: Save viewing-page files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet && exit 0
          git commit -m "Prepare temporary viewing page"
          git push
