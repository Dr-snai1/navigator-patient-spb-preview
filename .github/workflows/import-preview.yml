name: Verify existing built preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-preview.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact built-only checkpoint in docs
        run: |
          python3 - <<'PY'
          import json,pathlib
          sha='a160d2e154291d2abba4e022d668aed0b0873d14'
          tree='0319e0b1b9622bdd19adc5a42b96ad4335a8c53c'
          for root in ['site','docs']:
            p=pathlib.Path(root)
            m=json.loads((p/'preview-meta.json').read_text())
            q=json.loads((p/'checkout-proof.json').read_text())
            assert m['preview'] and not m['production']
            assert m['sourceSha']==sha and m['sourceTreeSha']==tree
            assert q['localHeadSha']==sha and q['localTreeSha']==tree
            assert (p/'404.html').exists() and (p/'index.html').exists()
            files=[str(x.relative_to(p)) for x in p.rglob('*') if x.is_file()]
            assert all(f in ['index.html','404.html','preview-meta.json','checkout-proof.json'] or f.startswith('assets/') for f in files)
          print('T047 preserved exact built-only Pages preview')
          PY
