name: Verify exact T077 built preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-preview.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiled files in site and docs
        run: |
          python3 - <<'PY'
          import json,pathlib
          for root in ['site','docs']:
            p=pathlib.Path(root)
            m=json.loads((p/'preview-meta.json').read_text())
            q=json.loads((p/'checkout-proof.json').read_text())
            assert m['sourceSha']=='7dc1b5e969c477bde774ae4ed16405ab10ad94c0'
            assert m['sourceTreeSha']=='8617e6120eb6659adafcb0501ca3ea7a221b60d7'
            assert m['checkpoint']=='baseline-s01-s07-no-q701-2026-10-09'
            assert m['tagObject']=='71b70dc100e4bd5d4f5f3307b3abc4a5b0b46b94'
            assert m['basePath']=='/navigator-patient-spb-preview/'
            assert m['preview'] is True and m['production'] is False
            assert q['localHeadSha']==m['sourceSha'] and q['localTreeSha']==m['sourceTreeSha']
            assert q['localTreeMatchesRequestedCommit']
            files=[str(x.relative_to(p)) for x in p.rglob('*') if x.is_file()]
            assert all(x in ['index.html','404.html','preview-meta.json','checkout-proof.json'] or x.startswith('assets/') for x in files)
            assert (p/'404.html').exists()
          print('T077 no-Q701 compiled payload PASS')
          PY
