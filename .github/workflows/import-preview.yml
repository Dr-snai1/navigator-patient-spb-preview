name: Verify exact S07 built preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-preview.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact S07 compiled files
        run: |
          python3 - <<'PY'
          import json,pathlib
          sha='3c1fb6b8b15c2e7abc62f8d8cc3a787aada2c4fc'
          tree='9ab8eae79fc27378528a043c9331c808f03e5b7b'
          for root in ['site','docs']:
            p=pathlib.Path(root)
            m=json.loads((p/'preview-meta.json').read_text())
            q=json.loads((p/'checkout-proof.json').read_text())
            assert m['preview'] and not m['production']
            assert m['sourceSha']==sha and m['sourceTreeSha']==tree
            assert m['checkpoint']=='baseline-s01-s07-2026-10-09'
            assert m['tagObject']=='be030ed76b24dda2ab95e0864c4489484c476419'
            assert m['basePath']=='/navigator-patient-spb-preview/'
            assert q['localHeadSha']==sha and q['localTreeSha']==tree
            assert q['localTreeMatchesRequestedCommit'] is True
            assert (p/'404.html').exists() and (p/'index.html').exists()
            files=[str(x.relative_to(p)) for x in p.rglob('*') if x.is_file()]
            assert all(f in ['index.html','404.html','preview-meta.json','checkout-proof.json'] or f.startswith('assets/') for f in files)
          print('T069 preserved exact built-only Pages preview')
          PY
